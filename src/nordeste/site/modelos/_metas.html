<title>{{ pagina.titulo }}</title>
<meta name="description" content="{{ pagina.descricao }}">
<link rel="canonical" href="{{ pagina.url }}">
{% for i in pagina.idiomas %}
<link rel="alternate" hreflang="{{ i.lang }}" href="{{ i.url }}">
{% endfor %}
{% for i in pagina.idiomas if i.idioma == "pt" %}
<link rel="alternate" hreflang="x-default" href="{{ i.url }}">
{% endfor %}
{% if pagina.noindex %}
<meta name="robots" content="noindex">
{% endif %}
<meta property="og:type" content="website">
<meta property="og:site_name" content="Nordeste em Números">
<meta property="og:title" content="{{ pagina.titulo }}">
<meta property="og:description" content="{{ pagina.descricao }}">
<meta property="og:url" content="{{ pagina.url }}">
<meta property="og:image" content="{{ pagina.imagem.url }}">
<meta property="og:image:width" content="{{ pagina.imagem.largura }}">
<meta property="og:image:height" content="{{ pagina.imagem.altura }}">
<meta property="og:image:alt" content="{{ pagina.imagem.alt }}">
<meta property="og:locale" content="{{ pagina.og_locale }}">
{% for i in pagina.idiomas if not i.atual %}
<meta property="og:locale:alternate" content="{{ i.og_locale }}">
{% endfor %}
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:image" content="{{ pagina.imagem.url }}">
<meta name="twitter:image:alt" content="{{ pagina.imagem.alt }}">
{% if pagina.json_ld %}
<script type="application/ld+json">{{ pagina.json_ld|safe }}</script>
{% endif %}
