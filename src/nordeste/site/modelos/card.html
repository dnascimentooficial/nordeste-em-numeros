{% extends "base.html" %}
{% from "_cartao.html" import cartao with context %}
{% block conteudo %}
<section class="nn-pagina" id="card" aria-label="{{ card.rotulo }}">
{{ cartao(card, textos.cards, data_curta, ui) }}

  <p><a href="{{ rotas.cards }}">{{ textos.cards.voltar }}</a></p>
</section>
{% endblock %}
