{% from "_componentes.html" import atualizacoes, legenda with context %}
{# O gráfico grande e o contexto dele, num <template> que o site.js clona no <dialog> (Ruling S-W). Os templates não
   ficam no HTML da página (pesavam ~89 KB no Início): saem em /ampliados/<idioma>-<página>.json (modelo ampliados.html),
   que o site.js pede na primeira vez que o modal abre (ou quando o mouse ou o foco chega num botão Ampliar). #}
{% macro ampliado(p, g, t) %}
<template class="nn-ampliado" id="nn-ampliado-{{ g.id }}">
  <div class="nn-ampliado-conteudo">
    <h2 class="nn-modal-titulo">{{ p.frase_feita }}</h2>
{% if g.titulo %}
    <h3>{{ g.titulo }}</h3>
{% endif %}
{% if g.subtitulo %}
    <p class="nn-muted">{{ g.subtitulo }}</p>
{% endif %}
{{ legenda() }}
    <div class="nn-graf-grande">{{ g.ampliado|safe }}</div>
{% for q in g.quebras %}
    <p class="nn-muted nn-nota-quebra">{{ t.quebra }} {{ q.ano }}: {{ q.rotulo }}.</p>
{% endfor %}
{% if p.alerta %}
    <p class="nn-muted nn-alerta">{{ p.alerta }}</p>
{% endif %}
    <div class="nn-fonte">
{% for linha in p.fonte %}
      <span>{{ linha }}</span>
{% endfor %}
{{ atualizacoes(g.atualizacoes) }}    </div>
  </div>
</template>
{% endmacro %}
{# A janela única da página: vazia até o site.js abrir um gráfico (sem JavaScript os botões "Ampliar" ficam escondidos).
   `ampliados` é o endereço (com ?v=) do JSON dos gráficos ampliados da página. #}
{% macro dialogo(t, ampliados) %}
<dialog class="nn-modal" aria-labelledby="nn-modal-titulo" data-ampliados="{{ ampliados }}">
  <div class="nn-modal-caixa">
    <div class="nn-modal-topo">
      <button type="button" class="nn-modal-fechar"><span>{{ t.fechar }}</span> <span aria-hidden="true">×</span></button>
    </div>
    <p class="nn-modal-gire">{{ t.gire }}</p>
    <div class="nn-modal-corpo"></div>
  </div>
</dialog>
{% endmacro %}
