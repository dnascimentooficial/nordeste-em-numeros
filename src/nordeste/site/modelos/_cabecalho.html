<header class="nn-topo">
  <div class="nn-hero-topo">
    <div class="nn-topo-titulo">
      <a class="nn-marca" href="/">Nordeste em Números</a>
      <p class="nn-autoria">por <a href="{{ autor_url }}"><strong>{{ autor.nome }}</strong></a></p>
    </div>
    <div class="nn-topo-linha" aria-hidden="true"></div>
    <nav class="nn-menu" aria-label="Páginas do site">
{% for item in menu %}
      <a href="{{ item.rota }}"{% if item.chave == pagina.chave %} aria-current="page"{% endif %}>{{ item.rotulo }}</a>
{% endfor %}
    </nav>
  </div>
</header>
