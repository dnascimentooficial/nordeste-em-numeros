      url: "https://commons.wikimedia.org/wiki/File:Lavage_du_Minerai_d%E2%80%99_Or,_Pres_de_la_Montagne_Itacolumi,_da_Cole%C3%A7%C3%A3o_Brasiliana_Iconogr%C3%A1fica.jpg"

  - id: "1808"
    inicio: 1808
    fim: 1889
    nome: Empire and revolts
    resumo: "The court settles in Rio, Pernambuco rebels, coffee takes sugar's place and the Northeast sells people to the South."
    texto: |-
      With the court in Rio, the northern provinces began paying taxes that supported the new capital and the war in the South. This came on top of the drought of 1816 and poor prices for sugar and cotton. In 1817 Pernambuco rebelled. The base of the revolt was an alliance of sugar and cotton producers with Recife merchants. In 1824 came the Confederation of the Equator. The central government put down both.

      Over the century, coffee from the Paraíba Valley, and later from São Paulo, took sugar's place in exports. When the Atlantic slave trade ended in 1850, the price of an enslaved person rose on the coffee plantations. Owners in the Northeast sold people there. Robert Slenes estimates that at least 200,000 people were taken to the Southeast through this internal trade, between the 1850s and the 1880s. The sale was the decision of those who owned people here. The demand came from there.

      The Great Drought of 1877 to 1879 killed tens of thousands of people in Ceará alone. Rodolpho Theóphilo counted 27,378 dead in Fortaleza in a little over two months. For the whole region, the estimates diverge so much that I prefer not to use any. Slavery ended only in 1888, one year before the end of the Empire, and the Northeast reached the Republic with less weight in the country's economy than it had at the start of the century.
    marcos:
      - {ano: 1817, titulo: "Pernambuco Revolution", texto: "Taxes for the court, the drought of 1816 and bad prices push Pernambuco to revolt."}
      - {ano: 1850, titulo: "End of the Atlantic slave trade", texto: "The sale of enslaved people from the Northeast to the coffee plantations begins."}
      - {ano: 1877, titulo: "Great Drought", texto: "The drought lasts until 1879 and kills tens of thousands of people in Ceará."}
    numeros:
      - valor: "at least 200,000"
        legenda: "Enslaved people taken to the Southeast through the internal slave trade, from the 1850s to the 1880s."
        tipo: historiador
        fonte: "Robert Slenes, doctoral dissertation (Stanford, 1976), cited in the journal Resgate (Unicamp)"
      - valor: "tens of thousands"
        legenda: "Deaths in the Great Drought of 1877 to 1879, in Ceará alone, as a floor. In Fortaleza alone, there were 27,378 in a little over two months, by Rodolpho Theóphilo's count."
        tipo: historiador
        fonte: "María Verónica Secreto, A seca de 1877-1879 no Império do Brasil (The drought of 1877-1879 in the Empire of Brazil), História, Ciências, Saúde – Manguinhos, vol. 27, no. 1, 2020, p. 36, citing Rodolpho Theóphilo"
    o_que_ficou: "Under the Empire, the Northeast lost exports to coffee and lost people, sold to the South. The drought of 1877 fixed the region's image as a place of disaster, and that image still weighs on it."
    fontes:
