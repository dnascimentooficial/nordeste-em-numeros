  - id: "1889"
    inicio: 1889
    fim: 1930
    nome: "First Republic: café com leite politics, drought and Canudos"
    resumo: "Federal power stays with São Paulo and Minas, industry is born in the Southeast and drought gets a federal agency."
    texto: |-
      Under the Republic, the federal government stayed in the hands of São Paulo and Minas Gerais, and economic policy revolved around coffee. This arrangement is known as "café com leite" (coffee with milk) politics. Industry was born near the coffee. By Wilson Cano's figures, São Paulo's share of the country's industrial output rose from about one-sixth in 1907 to more than one-third in 1929. The Northeast went the other way. According to the same author, the region accounted for about 17% of the country's industrial output in 1907, and by 1939 that had fallen to about 10%.

      In the backlands of Bahia, the settlement of Canudos was destroyed by the Army in 1897, in the fourth expedition sent against it. The death tolls in circulation have no academic origin that I was able to verify, so I give no number here.

      Drought became a federal matter in 1909, with the Inspectorate of Works Against Drought, which would later become the DNOCS (National Department of Works Against Drought). The agency was run from Rio and built reservoirs and roads. Many reservoirs ended up inside large estates. In the backlands, the ones in charge were the coronéis, local bosses who controlled the vote and the land and now came to control the water too (the system known as coronelismo). Decades later, the report of the GTDN, a federal working group on Northeast development, would criticize this arrangement.

      From the outside, the era had a federal government turned toward coffee. From the inside, it had local rule that took hold of the water from public works.
    marcos:
      - {ano: 1897, titulo: "Canudos is destroyed", texto: "The Army's fourth expedition ends the war in October.",
         imagem: {arquivo: "marco-1897.webp", titulo: "Ruins of the Bom Jesus church in Canudos", autor: "Flávio de Barros", data: "1897", licenca: "dominio-publico", alt: "Sepia photograph of the destroyed stone walls of the Canudos church, with burned timber and rubble, after the war ended.", url: "https://commons.wikimedia.org/wiki/File:Ruins_church_in_canudos_1897.jpg"}}
      - {ano: 1909, titulo: "The Inspectorate of Works Against Drought is born", texto: "Decree 7,619 creates the first federal agency against drought."}
      - {ano: 1919, titulo: "The inspectorate becomes federal in name", texto: "Decree 13,687 creates the Federal Inspectorate of Works Against Drought."}
    numeros:
      - valor: "from 15.9% to 37.5%"
        legenda: "São Paulo's share of Brazil's industrial output, from 1907 to 1929."
        tipo: historiador
        fonte: "Wilson Cano, Desequilíbrios regionais e concentração industrial no Brasil 1930-1970 (Regional Imbalances and Industrial Concentration in Brazil, 1930-1970), p. 199"
      - valor: "from about 17% to about 10%"
        legenda: "The Northeast's share of Brazil's industrial output, from 1907 to 1939."
        tipo: historiador
        fonte: "Wilson Cano, Desequilíbrios regionais e concentração industrial no Brasil 1930-1970, p. 56"
    o_que_ficou: "Drought became federal policy in 1909, but public works reached first the places that already had power. And the country's industry grew far from the Northeast."
    fontes:
