  - id: "1930"
    inicio: 1930
    fim: 1950
    nome: Vargas and the great migration
    resumo: "The federal government centralizes, industry grows in the Center-South and Northeasterners begin leaving for São Paulo and Rio."
    texto: |-
      After 1930 the federal government began to decide more, and industry accelerated in the Center-South. For the Northeast, what was new was drought entering the Constitution. The 1934 Constitution ordered the federal government to spend at least 4% of its tax revenue not earmarked for other uses on defense against drought.

      The drought of 1932 showed the other side. Governments set up concentration camps to keep drought migrants (retirantes) away from the capitals, and the newspaper Correio da Manhã reported on the camps that year. Drought was treated as a public-order problem, and the drought migrant as a threat.

      It was in this period that Northeasterners began leaving for São Paulo and Rio, a flow that grew in the following decades. Drought pushed them out, and so did concentrated land. Farm work was precarious, and emergency work crews and water were under the control of local elites. I looked for a reliable number for how many left in those years and did not find one. So I give none.

      In 1945 the federal government created Chesf, the São Francisco hydroelectric company, to generate power at the Paulo Afonso falls, and the anti-drought inspectorate became the DNOCS. Power and water now had a federal company and a federal department. The land stayed with the same owners.
    marcos:
      - {ano: 1932, titulo: "Drought and concentration camps", texto: "Governments hold drought migrants in camps, far from the capitals.",
         imagem: {arquivo: "marco-1932.webp", titulo: "Pirambu camp, in Fortaleza", autor: "José Bonifácio Paranhos da Costa", data: "1932", licenca: "dominio-publico", alt: "Photograph of long zinc-roofed sheds on sandy ground, with drought migrants sitting on the ground and men drawing water from a hand pump in the foreground.", url: "https://conteudo.ebc.com.br/portal/projetos/2018/especiais-agua/campos-de-concentracao/"}}
      - {ano: 1934, titulo: "Drought enters the Constitution", texto: "Article 177 sets aside part of federal revenue for defense against drought.",
         imagem: {arquivo: "marco-1934.webp", titulo: "Cover of the 1934 Constitution", autor: "National Constituent Assembly, Imprensa Nacional (the national press)", data: "1934", licenca: "dominio-publico", alt: "Red cover of the Constitution of the Republic of the United States of Brazil, printed in 1934.", url: "https://commons.wikimedia.org/wiki/File:Capa_da_Constitui%C3%A7%C3%A3o_de_1934.jpg"}}
      - {ano: 1945, titulo: "Chesf and DNOCS are born", texto: "In October, a decree-law creates Chesf. In December, the anti-drought inspectorate becomes the DNOCS."}
    numeros:
