# Content for the "How we got here" page (spec docs/specs/2026-11-02-como-chegamos-design.md).
# Text in the author's voice, written from the approved dossier (docs/historia/dossie.md). Each number has a type and a source;
# those marked [C] in the dossier were left out. The population share is not typed in: it comes from historia/censos.csv.
# Milestone titles and number sources have no final period: the template adds it.
# Paragraphs of each era's text are separated by a blank line.
# Text approved by the user and cross-checked (cross-check in Task 7): the page goes live.
provisoria: false

abertura:
  titulo: How we got here
  subtitulo: "Northeast Brazil was once the economic center of the country. In eight eras, this page tells how the region fell behind and who decided what."
  legenda: "Share of Brazil's population living in the Northeast, by census. Source: IBGE (the national statistics office), SIDRA, tables 1286 (1872 to 2010) and 4709 (2022)."
  nota_estados: "Today's regional division did not exist in 1872. The series uses the states that now make up the Northeast, from Maranhão to Bahia. There was no census in 1910 or 1930, and the 2022 point comes from a different IBGE table, the one for the 2022 Census."
  texto: "I chose population because it is the one measure we can calculate from the first census, in 1872, to the latest. The Northeast gained people in every census. What shrank was its weight in the country, and the eras below explain why."

epocas:
  - id: "1530"
    inicio: 1530
    fim: 1654
    nome: The sugar colony
    resumo: "The Crown made sugar the colony's business, and the coast of Pernambuco and Bahia was where it happened."
    texto: |-
      I start with sugar because it is what made the Northeast the center of the colony. The Portuguese Crown divided the coast into captaincies and, in 1549, placed the seat of the colonial government in Salvador. Sugar mills (engenhos) spread across Pernambuco and Bahia in the second half of the 16th century. In 1570 the chronicler Gandavo counted 60 mills in Brazil, two-thirds of them in those two captaincies. A little more than ten years later, there were 120.

      The people who made that money were enslaved Africans, brought by force to plant, cut and grind cane. The profit stayed with a few. In the region, it went to the mill owners (senhores de engenho), who owned the land and the people. Outside the region, it went to those who carried the sugar to Europe, a trade in which the Dutch had weight. The model of settlement was decided in Lisbon. Concentrated land and slave labor were sustained by those who ruled here.

      In 1630 the Dutch West India Company took Olinda and Recife. The war lasted until 1654 and destroyed mills. By Roberto Simonsen's figures, sugar exports from the occupied captaincies fell by half after 1630. The Dutch were driven out by forces from the region itself. When they left, they took with them what they had learned here, and that weighed on the next era.
    marcos:
      - {ano: 1549, titulo: "Salvador becomes the seat of the colonial government", texto: "The Crown sets up the colony's government in Bahia."}
      - {ano: 1570, titulo: "Gandavo counts 60 sugar mills", texto: "Two-thirds of them are in Pernambuco and Bahia."}
      - {ano: 1630, titulo: "The Dutch take Olinda and Recife", texto: "The Dutch West India Company occupies Pernambuco until 1654.",
         imagem: {arquivo: "marco-1630.webp", titulo: "Conquest of Olinda in 1630, engraving from 1651–1652", autor: "Anonymous engraver, Rijksmuseum", data: "1651–1652", licenca: "dominio-publico", alt: "Black-and-white engraving of the town of Olinda on top of a hill, with its church, seen from the sea, and Dutch ships attacking the port.", url: "https://commons.wikimedia.org/wiki/File:Verovering_van_Olinda_in_Brazili%C3%AB_door_generaal_Hendrick_C._Loncq,_1630,_RP-P-OB-79.394.jpg"}}
    numeros:
      - valor: "from 60 to 120"
        legenda: "Sugar mills in Brazil, counted in 1570 and between 1583 and 1585."
        tipo: historiador
        fonte: "Stuart B. Schwartz, table 1, with the counts by Gandavo (1570) and Fernão Cardim (1583 to 1585)"
      - valor: "from 60,000 to 30,000 crates"
