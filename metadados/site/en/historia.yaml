        url: https://repositorio.ipea.gov.br/bitstream/11058/14495/1/Desequilibrios_regionais_concentra%c3%a7%c3%a3o_industrial.pdf
      - texto: "Article on anti-drought works from 1909 to 1945, journal Risco (USP)"
        url: https://revistas.usp.br/risco/article/view/203768
      - texto: "DNOCS, Carta de Serviços ao Cidadão (Citizen Service Charter, history of the agency)"
        url: https://www.gov.br/dnocs/pt-br/acesso-a-informacao/acoes-e-programas/copy_of_carta-de-servicos-ao-cidadao/cartadeservicos-red.pdf
      - texto: "Asas da graúna: Nordeste, Nordestes (Wings of the graúna: Northeast, Northeasts), Fundação Perseu Abramo (on the GTDN's critique of the reservoirs)"
        url: https://fpabramo.org.br/asas-da-grauna-nordeste-nordestes/
