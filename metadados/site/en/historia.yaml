        tipo: historiador
        fonte: "Roberto Simonsen, História Econômica do Brasil (1500/1820) (Economic History of Brazil), 6th edition"
    o_que_ficou: "The Northeast was the center of the colony, but the wealth stayed with a few owners of land and people. That pattern of concentrated land lasted through the following centuries."
