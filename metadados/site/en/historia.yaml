  - id: "1654"
    inicio: 1654
    fim: 1808
    nome: Competition, gold and the capital that moves
    resumo: "Sugar gets a competitor in the Caribbean, gold from Minas pulls the colony toward the Center-South, and the capital leaves Salvador."
    texto: |-
      After 1654, Northeast sugar had a competitor. The Dutch took technology and money to the Caribbean. Celso Furtado records that, less than ten years after the expulsion, a sugar economy of considerable size was already running there. The Northeast kept producing sugar, but now it shared the market with newer production.

      Historians disagree about how bad the damage was. Some speak of a sugar crisis, and others see a recovery lasting into the first decades of the 18th century. I will not pick a side. What nobody disputes is that the colony's center of gravity moved.

      Gold mining began in Minas Gerais at the end of the 17th century. Gold drew people, enslaved workers and the attention of the Crown, and it made Rio de Janeiro the port of the new wealth. In 1763 the capital moved from Salvador to Rio. Among other things, the move served to watch the mines closely and curb smuggling. It was a decision made in Lisbon, with gold in mind.

      In the region, the way of producing hardly changed. The mill owners kept land concentrated and kept slave labor, the same arrangement as before, now at a more contested price. The era ends in 1808, when the Portuguese court arrives in Rio and the political center moves to the Southeast for good.
    marcos:
      - {ano: 1654, titulo: "The Dutch leave Recife", texto: "The surrender, in January, ends the occupation. Caribbean sugar enters the competition soon after."}
      - {ano: 1661, titulo: "Peace of The Hague", texto: "Portugal pays an indemnity to the Netherlands, which gives up on the Northeast."}
      - {ano: 1763, titulo: "The capital moves from Salvador to Rio", texto: "Rio, the port for Minas gold, becomes the seat of the colonial government.",
         imagem: {arquivo: "marco-1763.webp", titulo: "Entrance to Rio de Janeiro seen from the anchorage, 18th-century watercolor", autor: "George Raper (attributed), National Library of Australia", data: "18th century", licenca: "dominio-publico", alt: "Watercolor of the entrance to Guanabara Bay, with Sugarloaf Mountain on the left, a fortress on the right and boats on the water.", url: "https://commons.wikimedia.org/wiki/File:Brazil_18thc_GuanabaraBay.jpg"}}
    numeros:
      - valor: "about 877 metric tons"
        legenda: "Gold produced in Brazil in the 18th century, in the most widely cited estimate."
        tipo: historiador
        fonte: "Virgílio Noya Pinto, O ouro brasileiro e o comércio anglo-português (Brazilian Gold and Anglo-Portuguese Trade), 2nd edition, 1979"
    o_que_ficou: "The center of decision-making went to the Southeast in 1763 and never came back. From then on, much of what was decided about the Northeast was decided far from it."
    fontes:
