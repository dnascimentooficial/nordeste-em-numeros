dataset:
  nome: "Nordeste em Números: historical database of Northeast indicators"
  descricao: "Official indicators for the Northeast, the Northeastern states, Brazil and Brazil outside the Northeast, covering economy, education, work, income, poverty, human development and innovation, from IBGE, INEP, Ipea, Atlas Brasil, INPI and Cetic.br. Compiled by Júlio Diógenes."

fontes:
  titulo: "All data sources"
  intro: "One row per series. When the source switches surveys in the middle of the period, the indicator has more than one series, and they are never spliced together. The links go to each source's official page."

formulas:
  titulo: "Formulas I use"
  intro: "Most numbers are published ready-made by the source. I only do the calculations below, all of them declared and checked."
  blocos:
    - titulo: "GDP per capita"
      itens:
        - "GDP per capita = GDP at current prices (in thousands of reais) ÷ resident population, multiplied by 1,000 to get reais."
        - "Each year's population is the one IBGE uses in the GDP per capita it publishes: the annual estimate, the 2010 Census in 2010 and the 2022 Census in 2022 and 2023."
        - "IBGE does not publish GDP per capita by region and state in a machine-readable format. I checked the calculation against the values it releases, and the result of that check is in the project's verification dictionary."
    - titulo: "Brazil outside the Northeast"
      itens:
        - "Counts (population, GDP, enrollments, unemployed people, employed people, informal workers, labor force, total household income): Brazil − Northeast."
        - "GDP per capita: (Brazil's GDP − Northeast's GDP) ÷ (Brazil's population − Northeast's population), multiplied by 1,000. It is the ratio of the differences, not the average of the states."
        - "Unemployment rate: (unemployed in Brazil − in the Northeast) ÷ (labor force in Brazil − in the Northeast), as a percentage."
        - "Informality rate: (informal workers in Brazil − in the Northeast) ÷ (employed people in Brazil − in the Northeast), as a percentage."
        - "Household income per person: (total household income in Brazil − in the Northeast) ÷ (PNAD Contínua population of Brazil − of the Northeast), multiplied by 1,000."
        - "When no published count exists to redo the calculation (poverty, Gini, IDEB, HDI-M, school dropout, earnings from work, GDP volume, internet access), the comparison is with Brazil as a whole."
        - "IBID: the reference is the national average published by INPI, which weights the states by GDP per capita. I do not calculate Brazil outside the Northeast."
    - titulo: "Comparison between territories"
      itens:
        - "Ratio = value for the Northeast (or the state) ÷ value for the reference, as a percentage. 100% means parity; 50%, half."
        - "In the site's sentences, the change over the period is the value for the last year with data minus the value for the first year with data, in percentage points."
    - titulo: "Values in reais"
      itens:
        - "Household income per person and earnings from work: constant reais, using IBGE's PNAD Contínua deflator, at average prices of the last year in the series."
        - "GDP and GDP per capita: current values for each year. Comparisons use the ratio between territories in the same year, which needs no deflator."
        - "GDP volume: chained index published by IBGE (first year = 100), with no calculation of mine."
    - titulo: "What I do not do"
      itens:
        - "I do not interpolate years with no data, project future years or estimate missing values."
        - "I do not splice different surveys together (PNAD and PNAD Contínua, Census and estimates)."
        - "I do not average rates across states: aggregates always come from the counts."

arquivos:
  titulo: "The files behind the numbers"
  intro: "The site reads only the published database, exactly as it appears in the files on the Data page, with the date and sha256 of each one."

medicao:
  titulo: "What I measure on this site"
  paragrafos:
    - "I use Umami, an open-source audience measurement tool, to learn how the site is read. It sets no cookies, records no sessions and collects no personal data, and I do not store anyone's IP address."
    - "What it counts: pages visited, time on each page, country and device type, the site a visitor came from, and clicks on site features (cards downloaded, spreadsheets downloaded, charts enlarged, sections read). I use these numbers only to decide what to improve here."
    - "Browsers with “Do Not Track” turned on are not counted. To opt out, set the localStorage key umami.disabled to 1. It works per browser, on that device only."

dados:
  titulo: "Data to download"
  intro: "These are the files the site reads, exactly as published. You can download, check and use them, crediting me and the official source of each series. The underlying data are public: IBGE, INEP, Ipea, Atlas Brasil, INPI and Cetic.br."
  conferir: "To verify, compute the sha256 of the downloaded file and compare it with the code next to it. If it differs, the file is not the published one."
  arquivos:
    base_nordeste.csv: "One row per indicator, territory and year."
    derivados.csv: "Ratios and other comparison metrics between territories."

estados:
  titulo: "The states of the Northeast"
  intro: "Pick an indicator to see the states year by year and the ranking for the last year with data. The values come from the same database as the rest of the site, and a year with no data is left blank."
  titulo_mapa: "The states, year by year"
  titulo_ranking: "Ranking in the latest available year"
  escala_pior: "worse"
  escala_melhor: "better"
  nota_do_mapa: "The darker the cell, the better the situation on that indicator. Hatched cell: year with no data. Values appear on hover and in the table below."
  rolagem: "Drag the map sideways to see all the years."
  tabela: "See all the numbers for the states"
  fonte: "Sources: IBGE (Regional Accounts, PNAD Contínua), INEP (IDEB, School Flow Indicators), Atlas Brasil (HDI-M) and INPI (IBID). I calculate the ratios with Brazil outside the Northeast from the published counts."
  sem_dados: "This indicator has no data for the states."
  notas:
    ibid: "For IBID (INPI's Brazil Innovation and Development Index), the map and the ranking show each state's position among the 27 federative units (26 states and the Federal District), and lower is better. INPI rescales the index every year, and it warns that a state's score cannot be compared across years. Position can be compared. The index score is in Explore."

explorar:
  titulo: "Explore the data"
  intro: "Pick an indicator and a territory to see the full series, or compare two side by side. Each line shows only what the source published."
  nota: "The strong line is the chosen territory. The light ones are references: Brazil and, for states and other regions, the Northeast. The line breaks when the survey changes or a year is missing, because different surveys are not spliced together."
  tabela: "See the numbers for the chosen territory"
  fonte: "Values as published by the source, with no interpolation. The sources and methods for each indicator are in About the data."
  sem_dados: "This indicator has no data for this territory."
  sem_periodo: "There is no data for this territory in the chosen period."
  erro: "I could not load the data for this indicator. Try again in a moment."
  zoom:
    grupo: "Chart settings"
    de: "From"
    ate: "To"
    inicio: "start"
    fim: "end"
    ampliar: "Zoom in on the variation"
    todo: "See the whole period"
    ajuda: "To see just one period, drag your mouse or finger across the chart, or choose the years. With a period chosen, \"Zoom in on the variation\" fits the vertical scale to its data; without it, the scale stays that of the full period, so the change does not look bigger than it is."

cards:
  titulo: "Cards to share"
  intro: "These are common sayings we hear about the Northeast. Open one, download the card image (vertical format, good for WhatsApp and Instagram) and send it to whoever needs to see it. The numbers come from the same database as the site, with the source in the card's footer. Some cards confirm part of the saying, and the card says so."
  sera: "What the data say"
  baixar: "Download image (PNG)"
  voltar: "See all cards"
