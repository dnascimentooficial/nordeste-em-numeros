abertura:
  eyebrow: "Nordeste em Números"
  titulo:
    - "Is the Northeast"
    - "still the same?"
  destaque: "It has changed. And there is still a long way to go."
  intro:
    - id: abertura_inicio
      texto: "Every now and then I hear that Brazil's Northeast is the same as ever. That nothing has changed. So I checked the official numbers, from 2000 to today."

faixa:
  rotulo: "The opening in numbers"
  id: abertura_numeros
  numeros:
    - valor: "{pib_pc_razao.ultimo:1%}"
      rotulo: "of the rest of the country's wealth per person is what the Northeast has"
      ano: "{pib_pc_razao.ano_ultimo}"
      comparacao: "it was **{pib_pc_razao.primeiro:1%}** in {pib_pc_razao.ano_primeiro}"
    - valor: "{pob_ne.ultimo:1%}"
      rotulo: "of the Northeast's population lives in poverty"
      ano: "{pob_ne.ano_ultimo}"
      comparacao: "it was **{pob_ne.primeiro:1%}** in {pob_ne.ano_primeiro} · in Brazil, today, **{pob_br.ultimo:1%}**"
  condicao: "pob_ne.ultimo < pob_ne.primeiro e pob_ne.ultimo > pob_br.ultimo"
  nota: "Everything here comes from IBGE (the national statistics office), INEP (the national education research agency), Ipea (the federal applied economic research institute) and Atlas Brasil (the Atlas of Human Development in Brazil). I estimate nothing myself. The gray bands in the charts show who governed the country in each period, only to place the dates in time. No number here says that a government caused a result."

