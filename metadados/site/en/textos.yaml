  leitura: "[nome]: [variacao] from [ano0] to [ano1], from R$ [v0] to R$ [v1] per person, per month"
  ranking:
    cresceu: {mais: "Grew the most", menos: "Grew the least"}
    hoje: {mais: "Highest income", menos: "Lowest income"}
  marca_ne: "Northeast"
  veredito:
    - id: mapa_renda_distancia_aumentou
      texto: "Income grew the most where it was lowest: {renda_topo6.ultimo:0} of the six states that grew the most since {renda_topo6.ano_primeiro} are in the Northeast. But, in reais, the gap to the Southeast widened: R$ {renda_gap_se.primeiro:0} in {renda_gap_se.ano_primeiro}, R$ {renda_gap_se.ultimo:0} in {renda_gap_se.ano_ultimo}."
    - id: mapa_renda_distancia_diminuiu
      texto: "Income grew the most where it was lowest: {renda_topo6.ultimo:0} of the six states that grew the most since {renda_topo6.ano_primeiro} are in the Northeast. And, in reais, the gap to the Southeast narrowed too: R$ {renda_gap_se.primeiro:0} in {renda_gap_se.ano_primeiro}, R$ {renda_gap_se.ultimo:0} in {renda_gap_se.ano_ultimo}."
  complemento:
    texto: "In proportion, the Northeast caught up: the region's income per person went from {renda_prop_se.primeiro:0%} to {renda_prop_se.ultimo:0%} of the Southeast's. The Northeast grew {renda_cresc_ne.ultimo:1%}; Brazil, {renda_cresc_br.ultimo:1%}."
