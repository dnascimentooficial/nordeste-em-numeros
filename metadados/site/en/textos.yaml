por_que:
  titulo: "Why I built this dashboard"
  paragrafos:
    - "Because I got tired of hearing that the Northeast is the same as ever, said with total certainty and not a single number in hand. I gathered the official data from 2000 to today, compared the Northeast with Brazil and with the rest of the country, and left everything open for anyone who wants to check."
    - "This is not cheerleading. Where things improved, I show it. Where the gap is still wide, I show that too."

como_ler:
  titulo: "How to read it"
  itens:
    - "The gray bands show who governed the country. They place the dates in time. They do not give credit or blame to anyone."
    - "When a survey changes (PNAD to PNAD Contínua, for example), the chart line breaks. Different surveys are not spliced together."
    - "A year with no data is left blank. I do not invent a point to connect the line."

o_que_falta:
  titulo: "What is still missing, and why"
  itens:
    - "2024 GDP: IBGE had not yet released the 2024 Regional Accounts (Contas Regionais) on the date of this publication."
    - "2007 GDP per capita: there is no published value to check the calculation against."
    - "Income and poverty before 2012: the old PNAD series has not been incorporated yet."
    - "Enrollments in 2003 and 2004: they exist, but INEP only published them as PDFs. In 2026."
    - "HDI-M (municipal human development index) for the Northeast in 2000 and 2010: not published for the region."
    - "Poverty line: confirmed by Ipeadata metadata, not by an IBGE publication."

autor:
  nome: "Júlio Diógenes"
  titulo: "About the author"
  fechar: "Close"
  link: "dnascimento.com.br"
  quem_sou:
    titulo: "Who I am"
    texto: "Executive director of the Laboratório Urbano Vivo de Vitória (LUV), the Vitória Living Urban Lab. For more than 17 years, I have helped professionals, companies and governments turn complex problems into executable decisions, using strategy, innovation, artificial intelligence and public policy."
    mais: "More about my work at dnascimento.com.br"
  motivacao:
    titulo: "Why I did this study"
    texto: "I did this study out of anger, and also out of pride. Anger at a discourse that keeps repeating that the Northeast is the same as ever, erases the region's history and ignores what states and municipalities did and failed to do. Pride in a region that has changed more than people say, even if a long road remains. So I checked the official data, from 2000 to today, and the history, from the colonial era to now. Nobody gets a free pass here: municipalities, states and the federal government share the bill. Every number has its source and calculation in plain view, for anyone who wants to rebut it or understand it."
  formacao_titulo: "Education"
  formacao:
    - "Specialization in Infrastructure Law, Governance and Regulation (Direito da Infraestrutura, Governança e Regulação), PUC Minas (in progress, 2026–2027)"
    - "Bachelor's degree in Computer Engineering, Uniamérica (2022–2026)"
    - "Specialization in Data Analysis, EBAC – Escola Britânica de Artes Criativas e Tecnologia (British School of Creative Arts and Technology) (2022)"
    - "Design, with an emphasis on Brand Management, Universidade Potiguar (2009–2012)"
  formacao_vazia: "Full education and career history at dnascimento.com.br"

