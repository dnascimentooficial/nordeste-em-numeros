    rotulo: "Household income per person in the 27 states"
    estado: "State"
    regiao: "Region"
    inicial: "R$ in [ano0]"
    final: "R$ in [ano1]"
    variacao: "Real change"
  fonte:
    - "Source: IBGE, annual PNAD Contínua (the continuous national household survey), table 7533 (average real monthly household income per capita, from all sources), at average prices of {renda_topo6.ano_ultimo}. Change and ranking calculated by the project."
    - "The series starts in {renda_topo6.ano_primeiro}, with the PNAD Contínua. This site does not splice it with the Census or with the old PNAD: they are different surveys, and mixing them creates change that does not exist."
  saida: "See the Northeast's states"

