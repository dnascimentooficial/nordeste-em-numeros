  eyebrow: "Income by state"
  titulo: "Where has income grown the most since {renda_topo6.ano_primeiro}?"
  intro: "Household income per person, per month, in the 27 federative units, adjusted for inflation. Each square sits roughly where its state is on the map; the Northeast's have an orange outline."
