      fonte: "IBGE, annual PNAD Contínua (continuous household survey)"
      base_origem: "SIDRA, table 4566, variable 5935"
superior:
  nome: "Higher education, undergraduate enrollments and institutions"
  series:
    censup_pre2009:
      fonte: "INEP, Higher Education Census, statistical summaries from 2001 to 2008"
