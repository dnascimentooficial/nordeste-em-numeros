# Textos fixos do site, em primeira pessoa. Marcadores {destaque.campo[:formato]} como em perguntas.yaml.
# O recorte de anos do selo ("2000 a ..."), a data da base e o sha256 saem da base publicada, no gerador.

# Imagem da abertura (opcional): ocupa a metade direita da abertura no desktop e uma faixa no topo no celular, com o
# texto sempre sobre preto. É o arquivo src/nordeste/site/estaticos/foto-abertura.webp (o nome que o estilo.css usa; webp
# de até 200 KB) e só vai para o site com esta chave. credito é o autor e url a página dele (obrigatórios); rotulo é o
# texto antes do crédito (sem ele, "Foto") e descricao, opcional, sai entre parênteses depois do crédito. Rodapé:
# "<rotulo>: <credito> (<descricao>)"; Sobre: "<rotulo> da abertura: <credito> (<descricao>).". Sem a chave, a abertura
# segue preta, não há crédito e a imagem não é copiada.
foto:
  rotulo: "Imagem"
  credito: "Júlio Diógenes"
  url: "https://dnascimento.com.br"
  descricao: "composição com praia, mata e sertão do Nordeste"

abertura:
  eyebrow: "Nordeste em Números"
  titulo:
    - "O Nordeste está"
    - "do mesmo jeito?"
  destaque: "Mudou. E ainda falta chão."
  # Cada parágrafo tem id (aparece no relatório quando sai) e, se afirma uma direção que a base pode inverter,
  # a condição que o sustenta, como nos fechos. Parágrafo cuja condição falha ou cujo texto cita destaque ausente não sai.
  intro:
    - id: abertura_inicio
      texto: "Volta e meia eu escuto que o Nordeste está do mesmo jeito. Que nada mudou. Fui conferir nos números oficiais, de 2000 para cá."

# Faixa logo abaixo da abertura: dois números grandes, cada um com a comparação (o primeiro ano e, na pobreza, o Brasil),
# e a nota de fontes. Na comparação, o trecho entre **asteriscos duplos** sai em negrito. Os números obedecem à condição
# (id abertura_numeros no relatório): se ela falha, ou se um destaque some da base, saem juntos. A nota (de onde vêm os
# dados e o que as faixas de governo não dizem) não depende de número e fica sempre.
faixa:
  rotulo: "A abertura em números"
  id: abertura_numeros
  numeros:
    - valor: "{pib_pc_razao.ultimo:1%}"
      rotulo: "da riqueza por pessoa do resto do país é a do Nordeste"
      ano: "{pib_pc_razao.ano_ultimo}"
      comparacao: "era **{pib_pc_razao.primeiro:1%}** em {pib_pc_razao.ano_primeiro}"
    - valor: "{pob_ne.ultimo:1%}"
      rotulo: "da população do Nordeste vive na pobreza"
      ano: "{pob_ne.ano_ultimo}"
      comparacao: "era **{pob_ne.primeiro:1%}** em {pob_ne.ano_primeiro} · no Brasil, hoje, **{pob_br.ultimo:1%}**"
  # "Era" (o primeiro ano, maior na pobreza) e "no Brasil, hoje" (abaixo do Nordeste).
  condicao: "pob_ne.ultimo < pob_ne.primeiro e pob_ne.ultimo > pob_br.ultimo"
  nota: "Tudo aqui vem do IBGE, do INEP, do Ipea e do Atlas Brasil. Nada é estimado por mim. As faixas cinza nos gráficos mostram quem governava o país em cada período, só para situar o tempo. Nenhum número aqui diz que um governo causou um resultado."

# O mapa logo depois da faixa: "Onde a renda mais cresceu desde 2012?". As 27 UFs em quadrados do mesmo tamanho, na
# posição aproximada de cada estado (src/nordeste/site/mapa.py), com duas vistas, o ranking das pontas e o veredito.
# Só a renda domiciliar per capita (PNAD Contínua, SIDRA 7533) tem as 27 UFs na base; o bloco some se faltar alguma.
# leitura é o rótulo de cada estado ([nome], [variacao], [ano0], [ano1], [v0], [v1] vêm da base). O veredito é o
# primeiro item cuja condição vale (nenhum vale: não sai); complemento sai se a condição dele vale.
mapa_renda:
  indicador: renda_dom_pc
  eyebrow: "Renda por estado"
  titulo: "Onde a renda mais cresceu desde {renda_topo6.ano_primeiro}?"
  intro: "Renda domiciliar por pessoa, por mês, nas 27 unidades da federação, já descontada a inflação. Os quadrados ficam mais ou menos onde cada estado fica no mapa; os do Nordeste têm o contorno laranja."
  abas:
    rotulo: "O que o mapa mostra"
    cresceu: "Quanto cresceu"
    hoje: "Quanto é hoje"
  rotulo_mapa: "Mapa dos 27 estados"
  legenda_cresceu: "Variação real de {renda_topo6.ano_primeiro} a {renda_topo6.ano_ultimo}"
  legenda_hoje: "R$ por pessoa, por mês, em {renda_topo6.ano_ultimo}"
  legenda_ne: "Nordeste"
  dica: "Passe o mouse, toque ou navegue pelo teclado num estado para ver o nome e o valor."
  leitura: "[nome]: [variacao] de [ano0] a [ano1], de R$ [v0] para R$ [v1] por pessoa, por mês"
  ranking:
    cresceu: {mais: "Cresceram mais", menos: "Cresceram menos"}
    hoje: {mais: "Renda mais alta", menos: "Renda mais baixa"}
  marca_ne: "NE"
  veredito:
    # "Cresceu mais onde era menor": o Nordeste começou abaixo do Brasil e cresceu mais que ele, e a maioria (4 ou
    # mais) dos seis estados que mais cresceram é do Nordeste. "Aumentou" e "diminuiu": a diferença Sudeste − Nordeste
    # em reais, do primeiro ao último ano.
    - id: mapa_renda_distancia_aumentou
      texto: "A renda cresceu mais onde era menor: {renda_topo6.ultimo:extenso} dos seis estados que mais cresceram desde {renda_topo6.ano_primeiro} são do Nordeste. Mas, em reais, a distância para o Sudeste aumentou: R$ {renda_gap_se.primeiro:0} em {renda_gap_se.ano_primeiro}, R$ {renda_gap_se.ultimo:0} em {renda_gap_se.ano_ultimo}."
      condicao: "renda_topo6.ultimo >= 4 e renda_ne.primeiro < renda_br.primeiro e renda_cresc_ne.ultimo > renda_cresc_br.ultimo e renda_gap_se.ultimo > renda_gap_se.primeiro"
    - id: mapa_renda_distancia_diminuiu
      texto: "A renda cresceu mais onde era menor: {renda_topo6.ultimo:extenso} dos seis estados que mais cresceram desde {renda_topo6.ano_primeiro} são do Nordeste. E, em reais, a distância para o Sudeste também diminuiu: R$ {renda_gap_se.primeiro:0} em {renda_gap_se.ano_primeiro}, R$ {renda_gap_se.ultimo:0} em {renda_gap_se.ano_ultimo}."
      condicao: "renda_topo6.ultimo >= 4 e renda_ne.primeiro < renda_br.primeiro e renda_cresc_ne.ultimo > renda_cresc_br.ultimo e renda_gap_se.ultimo < renda_gap_se.primeiro"
  complemento:
    id: mapa_renda_proporcao
    texto: "Em proporção, o Nordeste se aproximou: a renda por pessoa da região foi de {renda_prop_se.primeiro:0%} para {renda_prop_se.ultimo:0%} da do Sudeste. O Nordeste cresceu {renda_cresc_ne.ultimo:1%}; o Brasil, {renda_cresc_br.ultimo:1%}."
    condicao: "renda_prop_se.ultimo > renda_prop_se.primeiro e renda_cresc_ne.ultimo > renda_cresc_br.ultimo"
  tabela:
    resumo: "Ver os números dos 27 estados"
    rotulo: "Renda domiciliar por pessoa nos 27 estados"
    estado: "Estado"
    regiao: "Região"
    inicial: "R$ em [ano0]"
    final: "R$ em [ano1]"
    variacao: "Variação real"
  fonte:
    - "Fonte: IBGE, PNAD Contínua anual, tabela 7533 (rendimento médio mensal real domiciliar per capita, de todas as fontes), a preços médios de {renda_topo6.ano_ultimo}. Variação e ranking calculados pelo projeto."
    - "A série começa em {renda_topo6.ano_primeiro}, com a PNAD Contínua. Este site não a emenda com o Censo nem com a PNAD antiga: são pesquisas diferentes, e misturá-las cria variação que não existe."
  saida: "Ver os estados do Nordeste"

# O placar logo depois da faixa: uma linha por pergunta publicada, com o tema e o "No frigir dos ovos" dela (o fecho, com
# a primeira letra maiúscula). Pergunta cujo fecho saiu mostra sem_veredito no lugar, e a que saiu inteira some.
placar:
  eyebrow: "As seis perguntas"
  titulo: "O que os números respondem"
  sem_veredito: "Ver a resposta"

# Rótulos dentro de cada pergunta: os gráficos além do primeiro e a fonte vão para trás de um "ver mais". [n] é o número
# de gráficos escondidos (mais de um). legenda_siglas é o rótulo, para leitor de tela, da linha das siglas dos governos
# (F = FHC · L = Lula...), que sai de metadados/governos.csv. indice é o título do menu lateral das perguntas.
perguntas_rotulos:
  mais_um_grafico: "Ver mais 1 gráfico"
  mais_graficos: "Ver mais [n] gráficos"
  fonte_metodo: "Fonte e método"
  legenda_siglas: "Siglas dos governos nos gráficos:"
  indice: "As seis perguntas"

# As saídas no pé de cada pergunta. O card é o de `card` em perguntas.yaml e só aparece se foi publicado.
saidas:
  rotulo: "Continuar"
  card: "Baixar o card desta resposta"
  estados: "Ver os estados"
  explorar: "Explorar os dados"

# O menu do alto de todas as páginas. Os grupos Histórias e Dados abrem um painel de cartões (no celular, uma gaveta).
# [epocas] é o número de épocas de Como chegamos e [cards] o de cards publicados, por extenso até dez. O botão laranja
# leva à linha do tempo; em Como chegamos, e quando ela não é gerada, leva aos cards. Abaixo de 520 px, o trecho `antes`
# do botão some ("linha do tempo →").
menu:
  rotulo: "Páginas do site"
  abrir: "Abrir o menu"
  inicio: "Início"
  historias: "Histórias"
  dados: "Dados"
  sobre: "Sobre os dados"
  voltar_ao_topo: "Voltar ao topo"
  cartoes:
    como-chegamos:
      titulo: "Como chegamos até aqui"
      texto: "Do açúcar até hoje, em [epocas] épocas, com a fonte de cada número."
    inovacao:
      titulo: "Inovação"
      texto: "Internet, doutores, patentes e empregos em TI: o que cresceu e o que ainda não acompanhou o tamanho da região."
    cards:
      titulo: "Cards para compartilhar"
      texto: "[cards] frases feitas sobre o Nordeste confrontadas com o dado oficial."
    estados:
      titulo: "Estados"
      texto: "Os nove estados ano a ano, no mapa de calor e no ranking."
    explorar:
      titulo: "Explorar"
      texto: "Escolha o indicador e o território e compare dois lado a lado."
    dados:
      titulo: "Dados para baixar"
      texto: "A base inteira em CSV, com o código para conferir cada arquivo."
  botao_historia:
    antes: "Ver a"
    texto: "linha do tempo"
  botao_cards:
    texto: "Baixar um card"

# Bloco do Início que leva à página Como chegamos (só aparece quando ela é gerada), logo depois da faixa de números.
# O título é um modelo: [ano_inicial] e [parcela_inicial] (primeiro censo) e [ano_final] e [parcela_final] (último censo)
# saem de censos.csv, os mesmos números da abertura da página, e aparecem uma vez cada. credito é o rótulo antes do
# crédito da imagem de fundo (a da época 1530), que vem do historia.yaml.
compartilhamento:
  alt: "Ilustração de um mural com fotos antigas e atuais do Nordeste ligadas por fios vermelhos e, no centro, um bilhete: Nordeste, por que se desenvolveu aquém do restante do Brasil?"
  credito: "Ilustração de Júlio Diógenes, feita com inteligência artificial."

chamada_historia:
  eyebrow: "Como chegamos até aqui"
  titulo: "Em [ano_inicial], [parcela_inicial] dos brasileiros viviam no Nordeste. Em [ano_final], [parcela_final]."
  texto: "Como a região chegou até aqui, do açúcar até hoje, em oito épocas, com a fonte de cada número."
  botao: "Ver a linha do tempo →"
  credito: "Imagem"

# Botão "Ampliar" dos gráficos do Início e a janela que abre com o gráfico grande.
ampliar:
  botao: "Ampliar"
  rotulo: "Ampliar o gráfico"
  fechar: "Fechar"
  gire: "Gire o celular para ver melhor"
  quebra: "Quebra de série em"

por_que:
  titulo: "Por que eu fiz este painel"
  paragrafos:
    - "Porque cansei de ouvir que o Nordeste está do mesmo jeito, dito com toda a certeza do mundo e sem nenhum número na mão. Juntei os dados oficiais de 2000 para cá, comparei o Nordeste com o Brasil e com o resto do país, e deixei tudo aberto para quem quiser conferir."
    - "Não é peça de torcida. Onde melhorou, eu mostro. Onde a distância continua grande, eu mostro também."

como_ler:
  titulo: "Como ler"
  itens:
    - "As faixas cinza mostram quem governava o país. Servem para situar o tempo, não para dar crédito nem culpa a ninguém."
    - "Quando a pesquisa muda (PNAD para PNAD Contínua, por exemplo), a linha do gráfico quebra. Pesquisas diferentes não se emendam."
    - "Ano sem dado fica em branco. Eu não invento ponto para ligar a linha."

o_que_falta:
  titulo: "O que ainda falta, e por quê"
  itens:
    - "PIB de 2024: as Contas Regionais 2024 ainda não tinham sido divulgadas pelo IBGE na data desta publicação."
    - "PIB per capita de 2007: não há valor publicado para conferir o cálculo."
    - "Renda e pobreza antes de 2012: a série da PNAD antiga ainda não foi incorporada."
    - "Matrículas de 2003 e 2004: existem, mas o INEP só publicou em PDF. Em 2026."
    - "IDHM do Nordeste em 2000 e 2010: não publicado para a região."
    - "Linha de pobreza: confirmada pelos metadados do Ipeadata, não por publicação do IBGE."

# Autoria: o bloco "Desenvolvido por" do rodapé, o modal "Sobre o autor" e a seção #autor de Sobre saem desta chave, do
# mesmo texto. `link` é o trecho de quem_sou.mais e de formacao_vazia que vira link para o site do autor. `formacao` é
# opcional (lista de textos, do mais recente ao mais antigo; cada item é uma frase só): ausente, nula ou vazia, a seção mostra formacao_vazia. quem_sou.texto, formacao e motivacao
# são do autor (do site dele e do que ele passou); não pôr aqui fato biográfico que ele não tenha passado.
# A foto do autor é estaticos/autor.webp (opcional, WebP de até 100 KB): existindo, ela vai no círculo do rodapé; sem
# ela, o círculo mostra as iniciais. A marca gráfica são duas versões do logotipo, estaticos/marca-autor-clara.webp (branca,
# para fundo escuro) e estaticos/marca-autor-escura.webp (para fundo claro): aparece só se as duas existirem. Foto e marca
# são © do autor: o LICENSE.md precisa citá-las (um teste falha se não citar).
autor:
  nome: "Júlio Diógenes"
  titulo: "Sobre o autor"
  fechar: "Fechar"
  link: "dnascimento.com.br"
  quem_sou:
    titulo: "Quem sou"
    texto: "Diretor executivo do Laboratório Urbano Vivo de Vitória (LUV). Há mais de 17 anos, ajudo profissionais, empresas e governos a transformar problemas complexos em decisões executáveis, com estratégia, inovação, inteligência artificial e políticas públicas."
    mais: "Mais sobre o meu trabalho em dnascimento.com.br"
  motivacao:
    titulo: "Por que fiz este estudo"
    texto: "Fiz este estudo por raiva, e também por orgulho. Raiva de um discurso que repete que o Nordeste está do mesmo jeito, apaga a história da região e ignora o que estados e municípios fizeram e deixaram de fazer. Orgulho de uma região que mudou mais do que se diz, ainda que falte muito chão. Então fui conferir nos dados oficiais, de 2000 para cá, e na história, da Colônia até hoje. Aqui ninguém ganha passe livre: município, estado e União dividem a conta. Cada número tem fonte e cálculo à vista, para quem quiser rebater ou entender."
  formacao_titulo: "Formação"
  formacao:
    - "Especialização em Direito da Infraestrutura, Governança e Regulação, PUC Minas (em curso, 2026–2027)"
    - "Bacharelado em Engenharia da Computação, Uniamérica (2022–2026)"
    - "Especialização em Análise de Dados, EBAC – Escola Britânica de Artes Criativas e Tecnologia (2022)"
    - "Design, com ênfase em Gestão de Marca, Universidade Potiguar (2009–2012)"
  formacao_vazia: "Formação e trajetória completas em dnascimento.com.br"

# Metadados de página (título, descrição das prévias de compartilhamento) e conjunto de dados descrito no JSON-LD.
paginas:
  index:
    titulo: "O Nordeste está do mesmo jeito? · Nordeste em Números"
    descricao: "Conferi nos números oficiais do IBGE, do INEP, do Ipea e do Atlas Brasil se o Nordeste está do mesmo jeito. Cada resposta traz o gráfico e a fonte, para você conferir."
  como-chegamos:
    titulo: "Como chegamos até aqui · Nordeste em Números"
    descricao: "Conto em oito épocas como o Nordeste passou de centro econômico da colônia à região que ficou para trás, do açúcar até hoje, com a fonte de cada número."
  sobre:
    titulo: "Sobre os dados · Nordeste em Números"
    descricao: "Por que eu fiz este site, como ler os gráficos, todas as fontes, as fórmulas que eu uso e o que ainda falta na base."
  inovacao:
    titulo: "Inovação · Nordeste em Números"
    descricao: "Internet nos domicílios, doutores, pós-graduação, gasto estadual em ciência, patentes, indústria que inova e empregos em TI no Nordeste, com dados oficiais da CAPES, do INPI, do IBGE, do MCTI e do Cetic.br."
  estados:
    titulo: "Os estados do Nordeste · Nordeste em Números"
    descricao: "Mapa de calor ano a ano e ranking dos estados do Nordeste em indicadores de economia, trabalho, pobreza, educação, desenvolvimento humano e inovação, com dados oficiais do IBGE, do INEP, do Atlas Brasil e do INPI."
  explorar:
    titulo: "Explorar os dados · Nordeste em Números"
    descricao: "Escolha um indicador e um território, compare dois lado a lado e confira cada ano publicado pelas fontes oficiais."
  cards:
    titulo: "Cards para compartilhar · Nordeste em Números"
    descricao: "Frases feitas sobre o Nordeste confrontadas com os números oficiais, em cards prontos para baixar e compartilhar."
  dados:
    titulo: "Dados para baixar · Nordeste em Números"
    descricao: "Os arquivos CSV da base histórica do Nordeste, com a data de publicação e o sha256 de cada um, para conferir a integridade."

dataset:
  nome: "Nordeste em Números: base histórica de indicadores do Nordeste"
  descricao: "Indicadores oficiais do Nordeste, dos estados nordestinos, do Brasil e do Brasil fora do Nordeste, de economia, educação, trabalho, renda, pobreza, desenvolvimento humano e inovação, a partir do IBGE, do INEP, do Ipea, do Atlas Brasil, do INPI e do Cetic.br. Compilação de Júlio Diógenes."

fontes:
  titulo: "Todas as fontes de dados"
  intro: "Uma linha por série. Quando a fonte muda de pesquisa no meio do período, o indicador tem mais de uma série, e elas nunca são emendadas. Os links levam à página oficial de cada fonte."

formulas:
  titulo: "Fórmulas que eu uso"
  intro: "A maior parte dos números é publicada pronta pela fonte. Eu só faço as contas abaixo, todas declaradas e conferidas."
  blocos:
    - titulo: "PIB per capita"
      itens:
        - "PIB per capita = PIB a preços correntes (em mil reais) ÷ população residente, multiplicado por mil para chegar a reais."
        - "A população de cada ano é a que o IBGE usa no PIB per capita que divulga: a estimativa anual, o Censo de 2010 em 2010 e o Censo de 2022 em 2022 e 2023."
        - "O IBGE não publica o PIB per capita por região e estado em formato legível por máquina. Conferi o cálculo contra os valores que ele divulga, e o resultado da conferência está no dicionário de verificação do projeto."
    - titulo: "Brasil fora do Nordeste"
      itens:
        - "Contagens (população, PIB, matrículas, desocupados, ocupados, informais, força de trabalho, massa de renda): Brasil − Nordeste."
        - "PIB per capita: (PIB do Brasil − PIB do Nordeste) ÷ (população do Brasil − população do Nordeste), multiplicado por mil. É a razão das diferenças, não a média dos estados."
        - "Taxa de desocupação: (desocupados do Brasil − do Nordeste) ÷ (força de trabalho do Brasil − do Nordeste), em porcentagem."
        - "Taxa de informalidade: (informais do Brasil − do Nordeste) ÷ (ocupados do Brasil − do Nordeste), em porcentagem."
        - "Renda domiciliar por pessoa: (massa de renda do Brasil − do Nordeste) ÷ (população da PNAD Contínua do Brasil − do Nordeste), multiplicado por mil."
        - "Quando não existe contagem publicada para refazer a conta (pobreza, Gini, IDEB, IDHM, abandono escolar, rendimento do trabalho, volume do PIB, acesso à internet), a comparação é com o Brasil inteiro."
        - "IBID: a referência é a média nacional publicada pelo INPI, que pondera os estados pelo PIB per capita. Não calculo o Brasil fora do Nordeste."
    - titulo: "Comparação entre territórios"
      itens:
        - "Razão = valor do Nordeste (ou do estado) ÷ valor da referência, em porcentagem. 100% significa igualdade; 50%, metade."
        - "Nas frases do site, diferença no período é o valor do último ano com dado menos o do primeiro ano com dado, em pontos percentuais."
    - titulo: "Valores em reais"
      itens:
        - "Renda domiciliar por pessoa e rendimento do trabalho: reais constantes, pelo deflator da PNAD Contínua do IBGE, a preços médios do último ano da série."
        - "PIB e PIB per capita: valores correntes de cada ano. As comparações usam a razão entre territórios no mesmo ano, que dispensa deflator."
        - "Volume do PIB: índice encadeado publicado pelo IBGE (primeiro ano = 100), sem cálculo meu."
    - titulo: "O que eu não faço"
      itens:
        - "Não interpolo anos sem dado, não projeto anos futuros e não estimo valores ausentes."
        - "Não emendo pesquisas diferentes (PNAD e PNAD Contínua, Censo e estimativas)."
        - "Não tiro média de taxas entre estados: os agregados saem sempre das contagens."

arquivos:
  titulo: "Os arquivos por trás dos números"
  intro: "O site lê só a base publicada, exatamente como está nos arquivos da página Dados, com a data e o sha256 de cada um."

medicao:
  titulo: "O que eu meço neste site"
  paragrafos:
    - "Uso o Umami, um medidor de audiência de código aberto, para saber como o site é lido. Ele não usa cookies, não grava sessões e não coleta dados pessoais, e eu não guardo o endereço IP de ninguém."
    - "O que ele conta: as páginas visitadas, o tempo em cada uma, o país e o tipo de aparelho, o site de onde a pessoa veio e os cliques nos recursos do site (cards baixados, planilhas baixadas, gráficos ampliados, abas e estados do mapa, seções lidas). Uso esses números só para decidir o que melhorar aqui."
    - "Navegadores com o “Do Not Track” ligado não são contados. Para ficar de fora, grave no localStorage a chave umami.disabled com o valor 1. Vale só para aquele navegador, naquele aparelho."

dados:
  titulo: "Dados para baixar"
  intro: "Estes são os arquivos que o site lê, do jeito que foram publicados. Pode baixar, conferir e usar, com crédito a mim e à fonte oficial de cada série. Os dados de origem são públicos: IBGE, INEP, Ipea, Atlas Brasil, INPI e Cetic.br."
  conferir: "Para conferir, calcule o sha256 do arquivo baixado e compare com o código ao lado. Se for diferente, o arquivo não é o publicado."
  arquivos:
    base_nordeste.csv: "Uma linha por indicador, território e ano."
    derivados.csv: "Razões e outras métricas de comparação entre territórios."

estados:
  titulo: "Os estados do Nordeste"
  intro: "Escolha um indicador para ver os estados ano a ano e o ranking do último ano com dado. Os valores vêm da mesma base do resto do site, e ano sem dado fica em branco."
  titulo_mapa: "Os estados, ano a ano"
  titulo_ranking: "Ranking no último ano disponível"
  escala_pior: "pior"
  escala_melhor: "melhor"
  nota_do_mapa: "Quanto mais escura a célula, melhor a situação naquele indicador. Célula hachurada: ano sem dado. Os valores aparecem ao passar o mouse e na tabela abaixo."
  rolagem: "Arraste o mapa para o lado para ver todos os anos."
  tabela: "Ver todos os números dos estados"
  fonte: "Fontes: IBGE (Contas Regionais, PNAD Contínua), INEP (IDEB, Indicadores de Fluxo Escolar), Atlas Brasil (IDHM) e INPI (IBID). As razões com o Brasil fora do Nordeste eu calculo a partir das contagens publicadas."
  sem_dados: "Este indicador não tem dados para os estados."
  # Nota de um indicador, logo abaixo do título do mapa (chave da vista em explorar.INDICADORES_ESTADOS). Opcional.
  notas:
    ibid: "No IBID, o mapa e o ranking mostram a posição de cada estado entre as 27 unidades da federação, e quanto menor, melhor. É que o INPI refaz a escala do índice a cada ano, e ele mesmo avisa que a nota de um estado não se compara entre anos. A posição se compara. A nota do índice está no Explorar."

explorar:
  titulo: "Explorar os dados"
  intro: "Escolha um indicador e um território para ver a série completa, ou compare dois lado a lado. Cada linha mostra só o que a fonte publicou."
  nota: "A linha forte é o território escolhido. As claras são referências: o Brasil e, para estados e outras regiões, o Nordeste. A linha quebra quando a pesquisa muda ou falta um ano, porque pesquisas diferentes não se emendam."
  tabela: "Ver os números do território escolhido"
  fonte: "Valores como publicados pela fonte, sem interpolação. As fontes e os métodos de cada indicador estão em Sobre os dados."
  sem_dados: "Este indicador não tem dados para este território."
  sem_periodo: "Não há dados deste território no período escolhido."
  erro: "Não consegui carregar os dados deste indicador. Tente de novo em instantes."
  # Painel de zoom: só aparece com JavaScript (o gráfico redesenha no navegador).
  zoom:
    grupo: "Ajustes do gráfico"
    de: "De"
    ate: "Até"
    inicio: "início"
    fim: "fim"
    ampliar: "Ampliar a variação"
    todo: "Ver todo o período"
    ajuda: "Para ver só um período, arraste o mouse ou o dedo sobre o gráfico, ou escolha os anos. Com um período escolhido, \"Ampliar a variação\" ajusta a escala vertical aos dados dele; sem isso, a escala continua a do período completo, para a mudança não parecer maior do que é."

cards:
  titulo: "Cards para compartilhar"
  intro: "São frases feitas que a gente escuta sobre o Nordeste. Abra uma, baixe a imagem do card (formato vertical, bom para WhatsApp e Instagram) e mande para quem precisa ver. Os números saem da mesma base do site, com a fonte no rodapé do card. Alguns cards confirmam um pedaço da frase, e o card diz isso."
  sera: "O que os dados dizem"
  baixar: "Baixar imagem (PNG)"
  voltar: "Ver todos os cards"
