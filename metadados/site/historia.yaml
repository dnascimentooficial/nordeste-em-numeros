  - id: "1964"
    inicio: 1964
    fim: 1985
    nome: "Ditadura: obra grande e Sudene esvaziada"
    resumo: "Furtado é cassado, a Sudene perde o papel de planejar e parte dos incentivos fiscais vai para a Amazônia."
    texto: |-
      Em abril de 1964 Celso Furtado teve os direitos políticos suspensos com base no Ato Institucional n. 1 e deixou a Sudene. A superintendência continuou existindo, mas perdeu o papel de planejar a região. As decisões passaram a sair de Brasília.

      Em 1970 um decreto-lei criou o Programa de Integração Nacional e mandou para ele 30% dos incentivos fiscais. A primeira etapa do programa era abrir a Transamazônica e a Cuiabá-Santarém. Na prática, parte do desconto no imposto de renda que antes ia para projetos no Nordeste passou a pagar estrada na Amazônia. Quanto isso tirou, de fato, do Nordeste eu não consegui medir. A regra, porém, está no texto do decreto-lei. Em 1974 os incentivos da região foram reunidos num fundo, o Finor.

      Vieram fábricas e obras grandes, e a distância de renda por pessoa para o resto do país continuou grande. Medir essa distância nos anos 1960 e 1970 é difícil: as estimativas variam tanto conforme a fonte que um número só enganaria.

      A crítica mais dura a esse modelo veio de alguém de dentro. Francisco de Oliveira, que trabalhou na Sudene de 1959 a 1964, publicou em 1977 Elegia para uma re(li)gião, um livro contra o caminho que a Sudene seguiu, sobretudo depois do golpe.
    marcos:
      - {ano: 1964, titulo: "Furtado perde os direitos políticos", texto: "Em abril, com base no Ato Institucional n. 1, ele deixa a Sudene."}
      - {ano: 1970, titulo: "Programa de Integração Nacional", texto: "O Decreto-Lei 1.106 manda 30% dos incentivos fiscais para o programa que começa pela Transamazônica."}
      - {ano: 1974, titulo: "Nasce o Finor", texto: "O Decreto-Lei 1.376 reúne os incentivos do Nordeste num fundo."}
    numeros:
      - valor: "30%"
        legenda: "Parte dos incentivos fiscais que o decreto-lei de 1970 mandou para o Programa de Integração Nacional."
        tipo: oficial
        fonte: "Decreto-Lei 1.106, de 16 de junho de 1970, art. 5º"
    o_que_ficou: "A região ganhou fábricas e obras grandes, mas perdeu o lugar onde se pensava o próprio desenvolvimento. A distância de renda para o resto do país atravessou a ditadura sem fechar."
    fontes:
      - texto: "Decreto-Lei 1.106, de 16 de junho de 1970, que cria o Programa de Integração Nacional (Planalto)"
        url: https://www.planalto.gov.br/ccivil_03/decreto-lei/1965-1988/del1106.htm
      - texto: "Informações Fipe, n. 512 (sobre a cassação de Celso Furtado)"
        url: https://downloads.fipe.org.br/publicacoes/bif/bif512-82-84.pdf
      - texto: "Flávio Mendes, sobre Elegia para uma re(li)gião, de Francisco de Oliveira, Caderno CRH (2018)"
        url: https://www.redalyc.org/journal/3476/347659220009/347659220009.pdf

  - id: "1985"
    inicio: 1985
    fim: 2026
    nome: Redemocratização até hoje
    resumo: "A Constituição cria fundos regionais, a Sudene acaba e volta, e a região produz uma parte do PIB menor que a parte da população que vive nela."
    texto: |-
      A Constituição de 1988 reservou 3% do que a União arrecada com imposto de renda e IPI para financiar o setor produtivo do Norte, do Nordeste e do Centro-Oeste. Uma lei de 1989 regulamentou os fundos. O do Nordeste, o FNE, é operado pelo Banco do Nordeste, e metade do dinheiro vai para o semiárido. É uma parte fixa da arrecadação, escrita na Constituição.

      Em 2001 a Sudene foi extinta e trocada por uma agência, a Adene. Em 2007 uma lei complementar recriou a Sudene. A instituição que nasceu do diagnóstico de 1959 sumiu e voltou em seis anos.

      Em 2022, segundo as Contas Regionais do IBGE, o Nordeste produziu 13,8% do PIB do país. O IBGE avisa que essa série ainda vai ser revista, com outro ano de referência. A parte da população que vive aqui, na abertura desta página, é quase o dobro disso. Dito de outro jeito: o PIB por pessoa do Nordeste fica perto da metade do brasileiro.

      O dinheiro dos fundos e dos incentivos vem de decisão federal. Mas ele não se aplica sozinho. Passa por governos estaduais, bancos e empresas da própria região, que decidem onde ele vai parar. Não ponho resultado desta época na conta de governo nenhum.
    marcos:
      - {ano: 1988, titulo: "Constituição cria os fundos regionais", texto: "O artigo 159 reserva 3% do imposto de renda e do IPI para financiar o Norte, o Nordeste e o Centro-Oeste."}
      - {ano: 1989, titulo: "Lei 7.827 regulamenta o FNE", texto: "Metade do fundo do Nordeste vai para o semiárido."}
      - {ano: 2001, titulo: "Sudene extinta", texto: "Uma medida provisória troca a superintendência pela Adene."}
      - {ano: 2007, titulo: "Sudene recriada", texto: "A Lei Complementar 125, de 3 de janeiro, recria a superintendência."}
    numeros:
      - valor: "3%"
        legenda: "Parte da arrecadação federal de imposto de renda e IPI que a Constituição de 1988 reservou para financiar o setor produtivo do Norte, do Nordeste e do Centro-Oeste."
        tipo: oficial
        fonte: "Constituição de 1988, art. 159, inciso I, alínea c"
      - valor: "13,8%"
        legenda: "Parte do Nordeste no PIB do Brasil em 2022."
        tipo: oficial
        fonte: "IBGE, Contas Regionais 2022 (SIDRA, tabela 5938)"
    o_que_ficou: "A distância que começou a se formar quando o eixo saiu do Nordeste ainda está nos números de hoje. Mais de um em cada quatro brasileiros vive aqui, e a região produz menos de um sétimo do que o país produz."
    fontes:
