        url: https://www.gov.br/mdr/pt-br/assuntos/fundos-regionais-e-incentivos-fiscais/fundos-constitucionais-de-financiamento-fno-fne-e-fco/L7827.pdf
      - texto: "Medida Provisória 2.146-1, de 4 de maio de 2001, que extingue a Sudene (Câmara dos Deputados)"
        url: https://www2.camara.leg.br/legin/fed/medpro/2001/medidaprovisoria-2146-1-4-maio-2001-348819-norma-pe.html
      - texto: "Lei Complementar 125, de 3 de janeiro de 2007, que recria a Sudene (Câmara dos Deputados)"
        url: https://www2.camara.leg.br/legin/fed/leicom/2007/leicomplementar-125-3-janeiro-2007-548989-publicacaooriginal-64228-pl.html
      - texto: "IBGE, Contas Regionais 2022, SIDRA, tabela 5938 (participação no PIB do Brasil)"
        url: https://apisidra.ibge.gov.br/values/t/5938/n1/all/n2/2/v/496/p/2022
