# Conteúdo da página "Como chegamos até aqui" (spec docs/specs/2026-11-02-como-chegamos-design.md).
# Texto na voz do autor, escrito a partir do dossiê aprovado (docs/historia/dossie.md). Cada número tem tipo e fonte;
# os marcados [C] no dossiê ficaram de fora. A parcela da população não é digitada: vem de historia/censos.csv.
# Títulos de marco e fontes de número vão sem ponto final: o modelo põe o ponto.
# Parágrafos do texto de cada época separados por linha em branco.
provisoria: true

abertura:
  titulo: Como chegamos até aqui
  subtitulo: "O Nordeste já foi o centro econômico do Brasil. Esta página conta, em oito épocas, como a região ficou para trás e quem decidiu o quê."
  legenda: "Parcela da população brasileira que vivia no Nordeste, por censo. Fonte: IBGE, SIDRA, tabelas 1286 (1872 a 2010) e 4709 (2022)."
  nota_estados: "A divisão regional de hoje não existia em 1872. A série usa os estados que hoje formam o Nordeste, do Maranhão à Bahia. Não houve censo em 1910 nem em 1930, e o ponto de 2022 vem de outra tabela do IBGE, a do Censo 2022."
  texto: "Escolhi a população porque é a conta que dá para fazer do primeiro censo, em 1872, até o último. O Nordeste ganhou gente em todos os censos. O que encolheu foi o peso dele no país, e as épocas abaixo contam por quê."

epocas:
  - id: "1530"
    inicio: 1530
    fim: 1654
    nome: Colônia do açúcar
    resumo: "A Coroa fez do açúcar o negócio da colônia, e o litoral de Pernambuco e da Bahia era onde ele acontecia."
    texto: |-
      Começo pelo açúcar porque foi com ele que o Nordeste virou o centro da colônia. A Coroa portuguesa dividiu o litoral em capitanias e, em 1549, pôs o governo-geral em Salvador. Os engenhos se espalharam por Pernambuco e pela Bahia na segunda metade do século XVI. Em 1570 o cronista Gandavo contou 60 engenhos no Brasil, dois terços deles nessas duas capitanias. Pouco mais de dez anos depois, já eram 120.

      Quem fez esse dinheiro foram africanos escravizados, trazidos à força para plantar, cortar e moer cana. O lucro ficava com poucos. Na região, com os senhores de engenho, donos da terra e de gente. Fora dela, com quem levava o açúcar para a Europa, um comércio em que os holandeses tinham peso. O modelo de ocupação foi decidido em Lisboa. A terra concentrada e o trabalho escravo foram sustentados por quem mandava aqui.

      Em 1630 a Companhia das Índias Ocidentais, holandesa, tomou Olinda e Recife. A guerra durou até 1654 e destruiu engenhos. Pelas contas de Roberto Simonsen, a exportação de açúcar das capitanias ocupadas caiu à metade depois de 1630. A expulsão dos holandeses foi feita por forças da própria região. Quando saíram, eles levaram o que tinham aprendido aqui, e isso pesou na época seguinte.
    marcos:
      - {ano: 1549, titulo: "Salvador vira sede do governo-geral", texto: "A Coroa instala na Bahia o governo da colônia."}
      - {ano: 1570, titulo: "Gandavo conta 60 engenhos", texto: "Dois terços deles ficam em Pernambuco e na Bahia."}
      - {ano: 1630, titulo: "Holandeses tomam Olinda e Recife", texto: "A Companhia das Índias Ocidentais ocupa Pernambuco até 1654."}
    numeros:
      - valor: "de 60 para 120"
        legenda: "Engenhos de açúcar no Brasil, contados em 1570 e entre 1583 e 1585."
        tipo: historiador
        fonte: "Stuart B. Schwartz, tabela 1, com as contagens de Gandavo (1570) e de Fernão Cardim (1583 a 1585)"
      - valor: "de 60 mil para 30 mil caixas"
        legenda: "Exportação anual de açúcar das capitanias ocupadas pelos holandeses, antes e depois de 1630."
        tipo: historiador
        fonte: "Roberto Simonsen, História Econômica do Brasil (1500/1820), 6ª edição"
    o_que_ficou: "O Nordeste foi o centro da colônia, mas a riqueza ficou com poucos senhores de terra e de gente. Esse desenho de terra concentrada atravessou os séculos seguintes."
    fontes:
      - texto: "Stuart B. Schwartz, capítulo sobre o Brasil colonial de 1580 a 1750, tabela 1 (cópia da UFPR)"
        url: https://docs.ufpr.br/~lgeraldo/textosbrasila/schwartzobrasilcolonial.pdf
      - texto: "Roberto Simonsen, História Econômica do Brasil (1500/1820), 6ª edição"
        url: https://portal2.fazenda.rj.gov.br/wp-content/uploads/2022/09/historia-economica-do-brasil-1500-1820.pdf
      - texto: "Celso Furtado, Formação Econômica do Brasil (1959), na resenha de Letícia Inácio (UFRRJ)"
        url: https://cursos.ufrrj.br/grad/cienciaseconomicas/files/2021/01/Resenha-Formação-Econômica-do-Brasil-Letícia-Inácio-.pdf
    imagem:
      arquivo: "1530.webp"
      titulo: "A fábrica de açúcar e a plantação do Engenho Real"
      autor: "Frans Post"
      data: "1660"
      licenca: "dominio-publico"
      alt: "Pintura de um engenho de açúcar em Pernambuco: a casa da moenda com arcos e telhado de telha, pessoas escravizadas trabalhando no terreiro, a casa-grande e a capela no alto do morro e a várzea com um rio ao fundo."
      url: "https://commons.wikimedia.org/wiki/File:Frans_Jansz._Post_-_Een_suikerfabriek_-_2116_(OK)_-_Museum_Boijmans_Van_Beuningen.jpg"

  - id: "1654"
    inicio: 1654
    fim: 1808
    nome: Concorrência, ouro e a capital que muda
    resumo: "O açúcar ganha concorrente nas Antilhas, o ouro de Minas puxa a colônia para o Centro-Sul e a capital sai de Salvador."
    texto: |-
      Depois de 1654, o açúcar do Nordeste ganhou concorrente. Os holandeses levaram técnica e dinheiro para as Antilhas. Celso Furtado registra que, menos de dez anos depois da expulsão, já funcionava lá uma economia açucareira de proporções consideráveis. O Nordeste continuou produzindo açúcar, só que agora dividia o mercado com uma produção mais nova.

      Os historiadores não concordam sobre o tamanho do estrago. Há quem fale em crise do açúcar e há quem veja recuperação até as primeiras décadas do século XVIII. Não vou escolher um lado. O que ninguém discute é que o eixo da colônia mudou de lugar.

      No fim do século XVII começou a mineração de ouro em Minas Gerais. O ouro atraiu gente, escravizados e a atenção da Coroa, e fez do Rio de Janeiro o porto da riqueza nova. Em 1763 a capital saiu de Salvador e foi para o Rio. A mudança serviu, entre outras coisas, para vigiar as minas de perto e conter o contrabando. Foi uma decisão de Lisboa, pensando no ouro.

      Na região, a forma de produzir quase não mudou. Os senhores de engenho mantiveram a terra concentrada e o trabalho escravo, o mesmo arranjo de antes, agora com um preço mais disputado. A época termina em 1808, quando a Corte portuguesa chega ao Rio e o centro político se muda de vez para o Sudeste.
    marcos:
      - {ano: 1654, titulo: "Os holandeses deixam o Recife", texto: "A capitulação, em janeiro, encerra a ocupação. O açúcar das Antilhas entra na disputa logo depois."}
      - {ano: 1661, titulo: "Paz de Haia", texto: "Portugal paga indenização aos Países Baixos, que desistem do Nordeste."}
      - {ano: 1763, titulo: "A capital vai de Salvador para o Rio", texto: "O Rio, porto do ouro de Minas, vira sede do governo da colônia."}
    numeros:
      - valor: "cerca de 877 toneladas"
        legenda: "Ouro produzido no Brasil no século XVIII, na estimativa mais citada."
        tipo: historiador
        fonte: "Virgílio Noya Pinto, O ouro brasileiro e o comércio anglo-português, 2ª edição, 1979"
    o_que_ficou: "O centro de decisão foi para o Sudeste em 1763 e não voltou mais. Daí em diante, muito do que se decidiu sobre o Nordeste foi decidido longe dele."
    fontes:
      - texto: "Celso Furtado, Formação Econômica do Brasil (1959), na resenha de Letícia Inácio (UFRRJ)"
        url: https://cursos.ufrrj.br/grad/cienciaseconomicas/files/2021/01/Resenha-Formação-Econômica-do-Brasil-Letícia-Inácio-.pdf
      - texto: "Virgílio Noya Pinto, O ouro brasileiro e o comércio anglo-português, 2ª edição, 1979 (estimativa citada em artigo acadêmico)"
        url: https://dialnet.unirioja.es/descarga/articulo/7186230.pdf
      - texto: "Maria Fernanda Bicalho, O Rio de Janeiro no século XVIII: a transferência da capital e a construção do território centro-sul da América portuguesa, revista Urbana (Unicamp)"
        url: https://periodicos.sbu.unicamp.br/ojs/index.php/urbana/article/download/8635108/2923/4361
      - texto: "Debate sobre a crise do açúcar no século XVII, revista Clio (UFPE)"
        url: https://periodicos.ufpe.br/revistas/index.php/revistaclio/article/download/24458/19774/48886
    imagem:
      arquivo: "1654.webp"
      titulo: "Lavage du minerai d'or, près de la montagne Itacolumi"
      autor: "Johann Moritz Rugendas"
      data: "c. 1835"
      licenca: "dominio-publico"
      alt: "Litografia colorida de homens escravizados lavando cascalho de ouro em canais de madeira ao pé de rochedos e cachoeiras, em Minas Gerais, vigiados por um feitor de chapéu."
      url: "https://commons.wikimedia.org/wiki/File:Lavage_du_Minerai_d%E2%80%99_Or,_Pres_de_la_Montagne_Itacolumi,_da_Cole%C3%A7%C3%A3o_Brasiliana_Iconogr%C3%A1fica.jpg"

  - id: "1808"
    inicio: 1808
    fim: 1889
    nome: Império e revoltas
    resumo: "A Corte se instala no Rio, Pernambuco se revolta, o café toma o lugar do açúcar e o Nordeste vende gente para o Sul."
    texto: |-
      Com a Corte no Rio, as províncias do Norte passaram a pagar impostos que sustentavam a nova capital e a guerra no Sul. Isso veio junto com a seca de 1816 e com preço ruim para o açúcar e o algodão. Em 1817 Pernambuco se revoltou. A base da revolta foi uma aliança de produtores de açúcar e algodão com comerciantes do Recife. Em 1824 veio a Confederação do Equador. O governo central reprimiu as duas.

      Ao longo do século, o café do Vale do Paraíba, e depois o de São Paulo, tomou o lugar do açúcar na exportação. Quando o tráfico de africanos acabou, em 1850, o preço do escravizado subiu nas fazendas de café. Proprietários do Nordeste venderam gente para lá. Robert Slenes estima que pelo menos 200 mil pessoas foram levadas para o Sudeste por esse tráfico interno, entre as décadas de 1850 e 1880. A venda foi decisão de quem era dono aqui. A procura vinha de lá.

      A Grande Seca de 1877 a 1879 matou dezenas de milhares de pessoas só no Ceará. Para a região inteira, as estimativas divergem tanto que prefiro não usar nenhuma. Fico com a ordem de grandeza mais segura. A escravidão só acabou em 1888, um ano antes do fim do Império, e o Nordeste chegou à República com menos peso na economia do país do que tinha no começo do século.
    marcos:
      - {ano: 1817, titulo: "Revolução Pernambucana", texto: "Impostos para a Corte, seca de 1816 e preços ruins levam Pernambuco à revolta."}
      - {ano: 1850, titulo: "Fim do tráfico atlântico", texto: "Começa a venda de escravizados do Nordeste para as fazendas de café."}
      - {ano: 1877, titulo: "Grande Seca", texto: "A seca vai até 1879 e mata dezenas de milhares de pessoas no Ceará."}
    numeros:
      - valor: "pelo menos 200 mil"
        legenda: "Escravizados levados para o Sudeste pelo tráfico interno, das décadas de 1850 a 1880."
        tipo: historiador
        fonte: "Robert Slenes, tese de doutorado (Stanford, 1976), citada na revista Resgate (Unicamp)"
      - valor: "dezenas de milhares"
        legenda: "Mortos na Grande Seca de 1877 a 1879, só no Ceará. As estimativas divergem, e por isso uso a ordem de grandeza."
        tipo: historiador
        fonte: "Artigo acadêmico sobre a Grande Seca no Ceará, Redalyc, documento 307470821003"
    o_que_ficou: "No Império o Nordeste perdeu a exportação para o café e perdeu gente, vendida para o Sul. A seca de 1877 fixou a imagem da região como lugar de flagelo, e essa imagem ainda pesa."
    fontes:
      - texto: "Robert Slenes, tese de doutorado (Stanford, 1976), citada na revista Resgate (Unicamp)"
        url: https://periodicos.sbu.unicamp.br/ojs/index.php/resgate/article/download/8645794/13094/18520
      - texto: "Robert Slenes, artigo de 2004 sobre o mercado de escravizados no Norte e no Nordeste"
        url: https://www.redalyc.org/journal/770/77070146007/77070146007.pdf
      - texto: "Artigo sobre a base social de 1817, revista Almanack (USP)"
        url: https://periodicos.usp.br/alb/article/download/11605/13374/14480
      - texto: "Artigo acadêmico sobre a Grande Seca no Ceará, Redalyc, documento 307470821003"
    imagem:
      arquivo: "1808.webp"
      titulo: "Bênção das bandeiras da Revolução de 1817"
      autor: "Antônio Parreiras"
      data: "s.d."
      licenca: "dominio-publico"
      alt: "Pintura de um padre de capa vermelha abençoando as bandeiras dos revoltosos de 1817 diante de uma igreja, cercado de homens de casaca, padres e soldados enfileirados."
      url: "https://commons.wikimedia.org/wiki/File:B%C3%AAn%C3%A7%C3%A3o_das_bandeiras_da_Revolu%C3%A7%C3%A3o_de_1817.jpg"

  - id: "1889"
    inicio: 1889
    fim: 1930
    nome: "Primeira República: café com leite, seca e Canudos"
    resumo: "O poder federal fica com São Paulo e Minas, a indústria nasce no Sudeste e a seca ganha um órgão federal."
    texto: |-
      Na República, o governo federal ficou nas mãos de São Paulo e Minas Gerais, e a política econômica girou em torno do café. A indústria nasceu perto do café. Pelas contas de Wilson Cano, a parte de São Paulo na produção industrial do país saiu de cerca de um sexto, em 1907, para mais de um terço, em 1929. Procurei o número do Nordeste nesses anos e não achei. Prefiro não chutar.

      No sertão da Bahia, o arraial de Canudos foi destruído pelo Exército em 1897, na quarta expedição mandada contra ele. As contas de mortos que circulam não têm origem acadêmica que eu tenha conseguido conferir, por isso não ponho número aqui.

      A seca virou assunto federal em 1909, com a Inspetoria de Obras Contra as Secas, que mais tarde viraria o DNOCS. O órgão era dirigido a partir do Rio e construiu açudes e estradas. Muitos açudes ficaram dentro de grandes propriedades. No sertão quem mandava eram os coronéis, que controlavam o voto e a terra e passaram a controlar também a água. Décadas depois, o relatório do GTDN criticaria esse arranjo.

      De fora, a época teve um governo federal voltado para o café. De dentro, um mando local que ficou com a água das obras públicas.
    marcos:
      - {ano: 1897, titulo: "Canudos é destruído", texto: "A quarta expedição do Exército encerra a guerra em outubro."}
      - {ano: 1909, titulo: "Nasce a Inspetoria de Obras Contra as Secas", texto: "O Decreto 7.619 cria o primeiro órgão federal contra as secas."}
      - {ano: 1919, titulo: "A inspetoria vira federal no nome", texto: "O Decreto 13.687 cria a Inspetoria Federal de Obras Contra as Secas."}
    numeros:
      - valor: "de um sexto a mais de um terço"
        legenda: "Parte de São Paulo no valor da produção industrial do Brasil, de 1907 a 1929."
        tipo: historiador
        fonte: "Wilson Cano, Raízes da concentração industrial em São Paulo"
    o_que_ficou: "A seca virou política federal em 1909, mas a obra pública chegou primeiro onde já havia poder. E a indústria do país nasceu longe do Nordeste."
    fontes:
      - texto: "Wilson Cano, Raízes da concentração industrial em São Paulo"
      - texto: "Artigo sobre as obras contra as secas de 1909 a 1945, revista Risco (USP)"
        url: https://revistas.usp.br/risco/article/view/203768
      - texto: "DNOCS, Carta de Serviços ao Cidadão (histórico do órgão)"
        url: https://www.gov.br/dnocs/pt-br/acesso-a-informacao/acoes-e-programas/copy_of_carta-de-servicos-ao-cidadao/cartadeservicos-red.pdf
      - texto: "Asas da graúna: Nordeste, Nordestes, Fundação Perseu Abramo (sobre a crítica do GTDN aos açudes)"
        url: https://fpabramo.org.br/asas-da-grauna-nordeste-nordestes/
    imagem:
      arquivo: "1889.webp"
      titulo: "400 jagunços prisioneiros"
      autor: "Flávio de Barros"
      data: "1897"
      licenca: "dominio-publico"
      alt: "Fotografia de centenas de mulheres, crianças e homens de Canudos sentados no chão depois da rendição, com soldados do Exército de pé ao fundo."
      url: "https://commons.wikimedia.org/wiki/File:Canudos_rebels.jpg"

  - id: "1930"
    inicio: 1930
    fim: 1950
    nome: Vargas e a grande migração
    resumo: "O governo federal centraliza, a indústria cresce no Centro-Sul e os nordestinos começam a sair para São Paulo e o Rio."
    texto: |-
      Depois de 1930 o governo federal passou a decidir mais, e a indústria acelerou no Centro-Sul. Para o Nordeste, a novidade foi a seca entrar na Constituição. A de 1934 mandou a União gastar com a defesa contra as secas pelo menos 4% da sua receita tributária.

      A seca de 1932 mostrou o outro lado. Governos montaram campos de concentração para segurar os retirantes longe das capitais, e o Correio da Manhã noticiou os campos naquele ano. A seca era tratada como problema de ordem pública, e o retirante, como ameaça.

      Foi nessa época que começou a saída de nordestinos para São Paulo e o Rio, um fluxo que cresceu nas décadas seguintes. A seca empurrava, e a terra concentrada também. O trabalho no campo era precário, e as frentes de trabalho e a água ficavam sob controle das elites locais. Procurei um número confiável de quantos saíram nesses anos e não achei. Por isso não ponho nenhum.

      Em 1945 o governo federal criou a Chesf, para gerar energia na cachoeira de Paulo Afonso, e a inspetoria contra as secas virou o DNOCS. A energia e a água passaram a ter empresa e departamento federais. A terra continuou com os mesmos donos.
    marcos:
      - {ano: 1932, titulo: "Seca e campos de concentração", texto: "Governos retêm retirantes em campos, longe das capitais."}
      - {ano: 1934, titulo: "A seca entra na Constituição", texto: "O artigo 177 reserva parte da receita federal para a defesa contra as secas."}
      - {ano: 1945, titulo: "Nascem a Chesf e o DNOCS", texto: "Em outubro, decreto-lei cria a Chesf. Em dezembro, a inspetoria contra as secas vira DNOCS."}
    numeros:
      - valor: "4%"
        legenda: "Piso da receita tributária federal para a defesa contra as secas, fixado pela Constituição de 1934."
        tipo: oficial
        fonte: "Constituição de 1934, art. 177"
    o_que_ficou: "Foi nessa época que a saída virou destino para gerações de nordestinos, e o Sudeste cresceu também com esse trabalho."
    fontes:
      - texto: "Constituição de 1934, art. 177 (Planalto)"
        url: https://www.planalto.gov.br/ccivil_03/constituicao/constituicao34.htm
      - texto: "Decreto-Lei 8.031, de 3 de outubro de 1945, que cria a Chesf (Planalto)"
        url: https://planalto.gov.br/ccivil_03/Decreto-Lei/Del8031.htm
      - texto: "Artigo sobre os campos de concentração de 1932, Anais do Simpósio Nacional da ANPUH, 2019"
        url: https://anpuh.org.br/uploads/anais-simposios/pdf/2019-01/1548874926_f8b61f43959074f84c38312d02d3702b.pdf
      - texto: "DNOCS, Carta de Serviços ao Cidadão (histórico do órgão)"
        url: https://www.gov.br/dnocs/pt-br/acesso-a-informacao/acoes-e-programas/copy_of_carta-de-servicos-ao-cidadao/cartadeservicos-red.pdf

  - id: "1950"
    inicio: 1950
    fim: 1964
    nome: BNB, GTDN e Sudene
    resumo: "Pela primeira vez, o atraso do Nordeste é tratado como problema econômico, com banco, diagnóstico e uma superintendência."
    texto: |-
      As secas de 1951 a 1952 e de 1958 mostraram o limite dos açudes. Em 1952 uma lei criou o Banco do Nordeste, com sede em Fortaleza. Em 1955 a Chesf inaugurou a primeira usina de Paulo Afonso.

      Em 1959 saiu o relatório do Grupo de Trabalho para o Desenvolvimento do Nordeste, o GTDN, coordenado por Celso Furtado. O diagnóstico era direto. A renda por pessoa do Nordeste não chegava a um terço da do Centro-Sul, e o problema era econômico e de estrutura, não só de clima. A proposta era industrializar a região.

      O relatório também olhou para dentro. A política de açudes tinha servido às grandes propriedades. No mesmo ano, as reportagens de Antônio Callado no Correio da Manhã deram nome à rede de latifundiários e políticos que vivia das obras contra a seca: indústria da seca. O nome pegou.

      Em dezembro de 1959 uma lei instituiu a Sudene. No começo dos anos 1960 vieram os descontos no imposto de renda para quem investisse em projetos no Nordeste, o sistema que ficou conhecido como 34/18, pelos números dos artigos das duas leis.

      Quem decidiu foi o governo federal: o banco, a superintendência e os incentivos. Mas o diagnóstico que justificou tudo isso dizia que parte do problema estava na própria região.
    marcos:
      - {ano: 1952, titulo: "Nasce o Banco do Nordeste", texto: "A Lei 1.649, de julho, cria o banco, com sede em Fortaleza."}
      - {ano: 1955, titulo: "Paulo Afonso começa a gerar energia", texto: "A Chesf inaugura a primeira usina na cachoeira do São Francisco."}
      - {ano: 1959, titulo: "GTDN e Sudene", texto: "Sai o relatório coordenado por Furtado, e em dezembro a Lei 3.692 institui a Sudene."}
      - {ano: 1961, titulo: "Começa o 34/18", texto: "A Lei 3.995 cria o desconto no imposto de renda para investir no Nordeste. A Lei 4.239, de 1963, o amplia."}
    numeros:
      - valor: "menos de um terço"
        legenda: "Renda por pessoa do Nordeste em relação à do Centro-Sul, no diagnóstico do GTDN."
        tipo: oficial
        fonte: "GTDN, Uma política de desenvolvimento econômico para o Nordeste, 1959"
    o_que_ficou: "Pela primeira vez o atraso do Nordeste foi tratado como problema econômico com causa conhecida, e não como castigo do clima. O BNB e a Sudene existem até hoje por causa dessa virada."
    fontes:
      - texto: "GTDN, Uma política de desenvolvimento econômico para o Nordeste, 1959 (ficha na Biblioteca do BNDES)"
        url: https://web.bndes.gov.br/bib/jspui/handle/1408/17760
      - texto: "Trechos do relatório do GTDN, Revista Brasileira de Geografia (IBGE)"
        url: https://rbg.ibge.gov.br/index.php/rbg/article/view/2493/1872
      - texto: "Lei 1.649, de 19 de julho de 1952, que cria o Banco do Nordeste (Planalto)"
